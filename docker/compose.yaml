services:
  # --- 1. SYSCALL-RELAYER ---
  syscall-relayer:
    build:
      context: ./syscall-relayer
    container_name: syscall-relayer
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./syscall-relayer/logs:/app/logs
    networks:
      - services-net
    env_file:
      - .env

  # --- 2. SYSCALL-WEBSITE ---
  syscall-website:
    build:
      context: ./syscall-website
    container_name: syscall-website
    restart: always
    ports:
      - "8090:8090"
    networks:
      - services-net

  # --- 3. SYSCALL-SMTP ---
  syscall-smtp:
    image: mailserver/docker-mailserver:latest
    container_name: syscall-smtp
    hostname: mail
    domainname: syscall-sdk.com  # <--- CHANGED
    restart: always
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    volumes:
      - ./syscall-smtp/mail-data:/var/mail
      - ./syscall-smtp/mail-state:/var/mail-state
      - ./syscall-smtp/mail-logs:/var/log/mail
      - ./syscall-smtp/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - DMS_DEBUG=0
      - PERMIT_DOCKER=connected-networks
    cap_add:
      - NET_ADMIN
    networks:
      - services-net

networks:
  services-net:
    external: true
